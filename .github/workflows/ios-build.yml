
name: Build Unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Build Environment
        run: |
          xcodebuild -version
          xcodebuild -list -project ThreeOneOSFive.xcodeproj

      - name: Build Unsigned iPhone App
        run: |
          set -euo pipefail

          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -scheme 3105 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package Unsigned IPA
        run: |
          set -euo pipefail

          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/3105.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: iPhone app build was not found."
            find build/DerivedData/Build/Products -maxdepth 3 -print
            exit 1
          fi

          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/3105.app

          cd build
          /usr/bin/zip -qry 3105-unsigned.ipa Payload

          test -s 3105-unsigned.ipa

      - name: Upload Unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: 3105-unsigned-ipa
          path: build/3105-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
